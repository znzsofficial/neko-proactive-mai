name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.14']
        sdk: [minimum, latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[test]" tzdata
      - if: matrix.sdk == 'minimum'
        run: python -m pip install "maibot-plugin-sdk==2.12.0"
      - if: matrix.sdk == 'latest'
        run: python -m pip install --upgrade "maibot-plugin-sdk>=2.12.0,<3"
      - run: python -m pip check
      - run: python scripts/check_tests.py
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python scripts/check_archive.py
