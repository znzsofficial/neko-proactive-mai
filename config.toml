[plugin]
enabled = false
config_version = "2.0.0"
version = "2.3.1"

[scheduler]
enabled = true
start_time = "08:00"
end_time = "23:00"
check_interval = 30
jitter = 3
probability = 0.7
min_interval_between_chats = 60
isolation_time = 0

[target]
allowed_groups = []
allowed_friends = ["12345678"]

[log]
verbose = true
scheduler_log = true

[intent]
group_text = "想和群友聊两句。结合当前对话、记忆和本次可用素材，选择一个自然话头；正在聊就顺着接，没有合适内容可以不发。不重复刚聊过的话，不必反问。"
private_text = "想找对方聊两句，优先分享有依据的见闻、感受或想法，也可以自然续接未结束的话题。吃饭、天气、行程等具体经历只依据已知信息，不自行补写。早晨可说早安；叫起床须有真实约定。正在聊就顺着接，不机械查岗，不重复追问已回答的事。没合适话头可以不发，不必以问题收尾。"
reason = "attention_proactive"
