[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "neko-proactive-mai"
version = "2.9.1"
description = "Planner-driven proactive chat scheduling for MaiBot"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = ["maibot-plugin-sdk>=2.12.0,<3"]

[project.optional-dependencies]
test = ["ruff==0.15.11"]

[project.urls]
Repository = "https://github.com/znzsofficial/neko-proactive-mai"
Issues = "https://github.com/znzsofficial/neko-proactive-mai/issues"

[tool.setuptools]
# This is a MaiBot plugin flat layout, not a distributable Python package.
# Keep editable installation for dependency setup without auto-discovering each
# top-level plugin/test module as a separate package.
py-modules = []

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
